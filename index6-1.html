<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical No. 6</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gradient-to-r from-teal-50 via-pink-400 to-rose-300">
    <div>
        <h1 class="text-center bg-cyan-100  font-bold m-4 underline  border-4 border-white-300 rounded-full w-200 md:w-50 lg:w-100 h-20 p-3 text-5xl">Practical 6</h1>
        <h3 class="text-center bg-teal-200  font-semibold  border-4 border-white rounded-lg mx-5 md:mx-10 lg:mx-20 l w-25 h-10 px-4 text-2xl">Marks calculator</h3>
        <table border="1" class="text-center text-xl w-full m-10">
            <br>
            <br>

    <tr class="text-2xl bg-gradient-to-l from-green-100 to-yellow-200 border-2 border-green-300 rounded-full px-4 mx-20">
        <th class="p-2 m-2 w-7">#</th>
    
        <th>subject</th>
    
        <th>marks</th>
    </tr>
    <tr>
        
        <td>1</td>
        <td>DMGT</td>
        <td><input type="number" id="s1" placeholder="Enter Marks"></td>
    </tr>

    <tr>
        <td>2</td>
        <td>CAO</td>
        <td><input type="number" id="s2" placeholder="Enter Marks"></td>
    </tr>
    <tr>
        <td>3</td>
        <td>MDM-WD</td>
        <td><input type="number" id="s3" placeholder="Enter Marks"></td>
    </tr>
    <tr>
        <td>4</td>
        <td>ES</td>
        <td><input type="number" id="s4" placeholder="Enter Marks"></td>
    </tr>
    <tr>
        <td>5</td>
        <td>ED</td>
        <td><input type="number" id="s5" placeholder="Enter Marks"></td>
    </tr>
    <tr>
        <td colspan="3" align="center">
        <button class="text-center m-10 bg-yellow-200 hover:bg-gradient-to-r from-teal-50 via-pink-400 to-rose-300 text-black-800 font-bold py-6 px-4  rounded" onclick="calc()"  </button>
            Calculate
        </td>
        
    </tr>
</table>
<h1 class="bg-yellow-200 rounded text-xl  w-full font-light hover:bg-pink-200 p-4 m-8 text-black-800">Total Marks</h1>
<h1 id="totalMarks" class="text-center bg-pink-200"></h1>
<br><br>
<h1 class="bg-yellow-200 w-fullrounded text-xl  font-light hover:bg-pink-200 p-4 m-8 text-black-800">Percentage %</h1>
<h1 id="percent" class="text-center bg-pink-200" ></h1>
<br><br>
<h1 class="bg-yellow-200 w-full rounded  text-xl  font-light hover:bg-pink-200 p-4 m-8 text-black-800">Grade</h1>
<h1 id="grade" class="text-center bg-pink-200"></h1>
<br><br>


    </div>
<script>
    function calc(){
        let sub1 = Number(document.getElementById("s1").value);
        let sub2 = Number(document.getElementById("s2").value);
        let sub3 = Number(document.getElementById("s3").value);
        let sub4 = Number(document.getElementById("s4").value);
        let sub5 = Number(document.getElementById("s5").value);
        
    
        let total = sub1 + sub2 + sub3 + sub4 + sub5;
        let per = (total/500)*100;
        let grade;
        if (per >= 90){
            grade = "A";
        } 
        else if(per >= 75){
             grade = "B";
        }
        else if(per >= 60){
              grade = "C";
        }
        document.getElementById("percent").innerHTML = per;
        document.getElementById("totalMarks").innerHTML = total;
        document.getElementById("grade").innerHTML = grade;
    }
    
</script>
</body>
    </html>
