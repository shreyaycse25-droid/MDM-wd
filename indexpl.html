<!DOCTYPE html>
<html>
<head>

    <title>College Event Registration</title>

 
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

    <h1 class="text-center text-3xl font-bold bg-blue-500 text-white p-5">
        College Event Registration
    </h1>


    <div class="max-w-md mx-auto bg-white p-6 mt-8 rounded-lg shadow">

        <h2 class="text-2xl font-bold mb-5">
            Register for Event
        </h2>


  
        <label>Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            class="w-full border p-2 mb-4 rounded"
        >


  
        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            class="w-full border p-2 mb-4 rounded"
        >


   
        <label>Select Event</label>

        <select
            id="event"
            class="w-full border p-2 mb-4 rounded"
        >

            <option value="">Select Event</option>

            <option value="Coding Competition">
                Coding Competition
            </option>

            <option value="Dance Competition">
                Dance Competition
            </option>

            <option value="Singing Competition">
                Singing Competition
            </option>

            <option value="Quiz Competition">
                Quiz Competition
            </option>

        </select>


  
        <button
            onclick="register()"
            class="w-full bg-green-500 text-white p-3 rounded hover:bg-green-600"
        >
            Register
        </button>


  
        <p
            id="message"
            class="text-center text-green-600 font-bold mt-5"
        ></p>

    </div>


 

    <script>

        function register() {

            var name =
                document.getElementById("name").value;

            var email =
                document.getElementById("email").value;

            var event =
                document.getElementById("event").value;


            if (name == "" || email == "" || event == "") {

                alert("Please fill all details");

            }

            else {

                document.getElementById("message").innerHTML =
                    "Registration Successful!<br>" +
                    "Name: " + name + "<br>" +
                    "Email: " + email + "<br>" +
                    "Event: " + event;

            }

        }

    </script>

</body>
</html>
